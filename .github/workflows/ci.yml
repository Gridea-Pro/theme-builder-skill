name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: Scaffold / Validate / Render smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [jinja2, go, ejs]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scaffold theme (${{ matrix.engine }})
        run: python scripts/scaffold_theme.py ci-smoke --engine ${{ matrix.engine }} --output-dir ./_ci_themes

      - name: Validate syntax
        run: python scripts/validate_syntax.py ./_ci_themes/ci-smoke

      - name: Render test
        run: python scripts/render_test.py ./_ci_themes/ci-smoke --output-dir ./_ci_output
        if: matrix.engine == 'jinja2'

  check-lib-sync:
    name: Check lib/ is in sync with src/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npx tsc -p tsconfig.json

      - name: Verify lib/ matches committed output
        run: git diff --exit-code lib/
